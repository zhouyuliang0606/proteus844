name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: selftest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 自检（10 项，含回归 13 项）
        run: python -m proteus844.selftest

      - name: 语法编译
        run: python -m compileall -q proteus844

      - name: 文档一致性
        run: python -m proteus844.tests.test_skill_docs

      - name: 数值把结果打到日志
        if: always()
        run: python -c "import sys, platform; print(sys.version); print(platform.platform())"
